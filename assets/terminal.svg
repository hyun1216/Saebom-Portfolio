<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <style>
      .t-mono { font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; }
      .t-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      
      .c-green { fill: #2dd4bf; }
      .c-blue { fill: #38bdf8; }
      .c-gray { fill: #94a3b8; }
      .c-dim { fill: #64748b; }
      .c-white { fill: #ffffff; }

      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .anim-cursor { animation: blinkCursor 1s infinite; fill: #2dd4bf; }

      @keyframes liveSignal {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .anim-signal { animation: liveSignal 2s infinite ease-in-out; fill: #10b981; }

      @keyframes flowStroke {
        to { stroke-dashoffset: -16; }
      }
      .anim-flow {
        stroke: #2dd4bf;
        stroke-dasharray: 4, 4;
        animation: flowStroke 1.5s linear infinite;
      }
    </style>
  </defs>

  <!-- 터미널 배경 -->
  <rect x="2" y="2" width="896" height="416" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />

  <!-- 상단 헤더 바 -->
  <circle cx="28" cy="22" r="5" fill="#f43f5e" />
  <circle cx="44" cy="22" r="5" fill="#f59e0b" />
  <circle cx="60" cy="22" r="5" fill="#10b981" />
  
  <text x="450" y="26" text-anchor="middle" class="t-mono c-dim" font-size="12">saebom: ~/portfolio-terminal</text>
  
  <circle cx="845" cy="22" r="4" class="anim-signal" />
  <text x="856" y="26" class="t-mono" fill="#10b981" font-size="11">ONLINE</text>
  
  <line x1="2" y1="42" x2="898" y2="42" stroke="#21262d" stroke-width="1.2" />

  <!-- 좌측 정보 영역 -->
  <text x="36" y="80" class="t-mono c-green" font-size="13" font-weight="bold">$ whoami</text>
  <text x="36" y="122" class="t-sans c-white" font-size="30" font-weight="900">노새봄</text>
  <text x="135" y="120" class="t-mono c-dim" font-size="14">@hyun1216</text>
  
  <text x="36" y="152" class="t-mono" font-size="18" font-weight="bold" fill="url(#neonCyan)">RPA & Workflow Engineer</text>
  <rect x="335" y="136" width="8" height="18" class="anim-cursor" />
  
  <text x="36" y="184" class="t-sans c-gray" font-size="13">비즈니스 병목을 해결하고 견고한 데이터 파이프라인을 구축합니다.</text>

  <!-- 스택 태그 -->
  <text x="36" y="224" class="t-mono c-green" font-size="13" font-weight="bold">$ cat stack.txt</text>
  
  <g transform="translate(36, 238)">
    <rect x="0" y="0" width="70" height="26" rx="5" fill="#161b22" stroke="#30363d" />
    <text x="35" y="17" text-anchor="middle" class="t-mono c-blue" font-size="11" font-weight="bold">Python</text>

    <rect x="78" y="0" width="56" height="26" rx="5" fill="#161b22" stroke="#30363d" />
    <text x="106" y="17" text-anchor="middle" class="t-mono c-blue" font-size="11" font-weight="bold">PAD</text>

    <rect x="142" y="0" width="94" height="26" rx="5" fill="#161b22" stroke="#30363d" />
    <text x="189" y="17" text-anchor="middle" class="t-mono c-blue" font-size="11" font-weight="bold">PowerShell</text>

    <rect x="244" y="0" width="84" height="26" rx="5" fill="#161b22" stroke="#30363d" />
    <text x="286" y="17" text-anchor="middle" class="t-mono c-blue" font-size="11" font-weight="bold">REST API</text>

    <rect x="336" y="0" width="68" height="26" rx="5" fill="#161b22" stroke="#30363d" />
    <text x="370" y="17" text-anchor="middle" class="t-mono c-blue" font-size="11" font-weight="bold">Docker</text>
  </g>

  <!-- 메트릭 카드 -->
  <g transform="translate(36, 305)">
    <rect x="0" y="0" width="125" height="66" rx="8" fill="#161b22" stroke="#21262d" />
    <text x="16" y="30" class="t-mono c-blue" font-size="20" font-weight="bold">80%</text>
    <text x="16" y="50" class="t-sans c-dim" font-size="11">작업 시간 절감</text>

    <rect x="135" y="0" width="125" height="66" rx="8" fill="#161b22" stroke="#21262d" />
    <text x="151" y="30" class="t-mono c-blue" font-size="20" font-weight="bold">10+ 건</text>
    <text x="151" y="50" class="t-sans c-dim" font-size="11">프로세스 배포</text>

    <rect x="270" y="0" width="135" height="66" rx="8" fill="#161b22" stroke="#21262d" />
    <text x="286" y="30" class="t-mono" fill="#10b981" font-size="20" font-weight="bold">99.9%</text>
    <text x="286" y="50" class="t-sans c-dim" font-size="11">파이프라인 가동률</text>
  </g>

  <!-- 세로 분리선 -->
  <line x1="480" y1="58" x2="480" y2="390" stroke="#21262d" stroke-width="1.2" stroke-dasharray="4,4" />

  <!-- 우측 파이프라인 영역 -->
  <g transform="translate(505, 70)">
    <text x="10" y="12" class="t-mono c-green" font-size="12" font-weight="bold">> PIPELINE_TOPOLOGY</text>

    <!-- 노드 1: TRIGGER -->
    <g transform="translate(10, 30)">
      <rect x="0" y="0" width="100" height="50" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="50" y="22" text-anchor="middle" class="t-mono c-dim" font-size="10">TRIGGER</text>
      <text x="50" y="38" text-anchor="middle" class="t-sans c-white" font-size="12" font-weight="bold">Schedule/API</text>
    </g>

    <!-- 연결선 1 -> 2 -->
    <line x1="110" y1="55" x2="160" y2="55" stroke="#30363d" stroke-width="2" />
    <line x1="110" y1="55" x2="160" y2="55" class="anim-flow" stroke-width="2" />

    <!-- 노드 2: BOT -->
    <g transform="translate(160, 22)">
      <rect x="0" y="0" width="180" height="64" rx="8" fill="#111c2a" stroke="#2dd4bf" stroke-width="1.4" />
      <circle cx="18" cy="20" r="4" class="anim-signal" />
      <text x="30" y="24" class="t-mono c-green" font-size="11" font-weight="bold">RPA WORKER</text>
      <text x="18" y="44" class="t-sans c-white" font-size="13" font-weight="bold">Data Pipeline & Parse</text>
      <text x="18" y="56" class="t-mono c-dim" font-size="10">status: active</text>
    </g>

    <!-- 하향 분기선 -->
    <path d="M 250 86 L 250 120" stroke="#30363d" stroke-width="2" />
    <path d="M 250 86 L 250 120" class="anim-flow" stroke-width="2" />

    <!-- 노드 3: FAULT GUARD -->
    <g transform="translate(160, 120)">
      <rect x="0" y="0" width="180" height="50" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="16" y="22" class="t-mono" fill="#f59e0b" font-size="10">FAULT TOLERANCE</text>
      <text x="16" y="38" class="t-sans c-white" font-size="12" font-weight="bold">Try-Catch & Logging</text>
    </g>

    <!-- 좌향 연결선 -->
    <line x1="160" y1="145" x2="110" y2="145" stroke="#30363d" stroke-width="2" />
    <line x1="160" y1="145" x2="110" y2="145" class="anim-flow" stroke-width="2" />

    <!-- 노드 4: TARGET -->
    <g transform="translate(10, 120)">
      <rect x="0" y="0" width="100" height="50" rx="6" fill="#161b22" stroke="#30363d" />
      <text x="50" y="22" text-anchor="middle" class="t-mono" fill="#10b981" font-size="10">DESTINATION</text>
      <text x="50" y="38" text-anchor="middle" class="t-sans c-white" font-size="12" font-weight="bold">ERP / DB</text>
    </g>

    <!-- 실시간 터미널 로그 출력창 -->
    <g transform="translate(10, 195)">
      <rect x="0" y="0" width="330" height="85" rx="6" fill="#04070a" stroke="#1e293b" />
      <text x="16" y="24" class="t-mono c-green" font-size="11">> daemon --status --active</text>
      <text x="16" y="44" class="t-mono c-gray" font-size="10">✔ [LOG] Workflow completed without error</text>
      <text x="16" y="60" class="t-mono c-dim" font-size="10">✔ [CRON] Next batch scheduled in 5m</text>
      <text x="16" y="74" class="t-mono c-blue" font-size="10">✔ [SYSTEM] All pipelines healthy</text>
    </g>
  </g>
</svg>
