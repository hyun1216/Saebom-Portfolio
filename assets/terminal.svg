<svg fill="none" viewBox="0 0 800 320" width="100%" height="320" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 12px; }
    .header-bar { fill: #161b22; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title-text { fill: #8b949e; font-family: monospace; font-size: 13px; text-anchor: middle; }
    .prompt { fill: #58a6ff; font-family: monospace; font-size: 14px; font-weight: bold; }
    .name { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 800; }
    .job-title { fill: #3fb950; font-family: monospace; font-size: 18px; font-weight: bold; }
    .desc { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
    
    .card-bg { fill: #161b22; stroke: #21262d; stroke-width: 1; rx: 8px; }
    .card-num { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
    .card-lbl { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; text-anchor: middle; }

    /* 커서 깜빡임 애니메이션 */
    .cursor { fill: #3fb950; animation: blink 1s infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <!-- 터미널 윈도우 배경 -->
  <rect width="800" height="320" class="bg" />
  
  <!-- 상단 헤더 바 -->
  <path d="M0 12C0 5.37258 5.37258 0 12 0H788C794.627 0 800 5.37258 800 12V36H0V12Z" class="header-bar" />
  <circle cx="24" cy="18" r="6" class="dot-red" />
  <circle cx="44" cy="18" r="6" class="dot-yellow" />
  <circle cx="64" cy="18" r="6" class="dot-green" />
  <text x="400" y="22" class="title-text">saebom: ~/portfolio</text>

  <!-- 터미널 본문 -->
  <text x="32" y="72" class="prompt">$ whoami</text>
  <text x="32" y="112" class="name">노새봄</text>
  
  <text x="32" y="142" class="job-title">RPA & Automation Engineer</text>
  <rect x="330" y="126" width="9" height="18" class="cursor" />
  
  <text x="32" y="172" class="desc">반복 업무를 제거하고 비즈니스 흐름을 최적화하는 엔지니어</text>

  <text x="32" y="214" class="prompt">$ cat metrics.txt</text>

  <!-- 지표 박스 3개 -->
  <g transform="translate(32, 228)">
    <!-- 박스 1 -->
    <rect width="225" height="60" class="card-bg" />
    <text x="112" y="26" class="card-num">80% +</text>
    <text x="112" y="46" class="card-lbl">업무 시간 단축</text>

    <!-- 박스 2 -->
    <g transform="translate(255, 0)">
      <rect width="225" height="60" class="card-bg" />
      <text x="112" y="26" class="card-num">10+ 건</text>
      <text x="112" y="46" class="card-lbl">자동화 프로세스 구축</text>
    </g>

    <!-- 박스 3 -->
    <g transform="translate(510, 0)">
      <rect width="225" height="60" class="card-bg" />
      <text x="112" y="26" class="card-num">Stable</text>
      <text x="112" y="46" class="card-lbl">예외 처리 및 파이프라인</text>
    </g>
  </g>
</svg>

.container {
background-color: #0d1117;
border: 1px solid #30363d;
border-radius: 12px;
padding: 20px;
color: #c9d1d9;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji";
box-shadow: 0 8px 24px rgba(0,0,0,0.5);
box-sizing: border-box;
height: 350px;
}
.header {
display: flex;
align-items: center;
margin-bottom: 20px;
}
.dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; display: inline-block; }
.red { background: #ff5f56; }
.yellow { background: #ffbd2e; }
.green { background: #27c93f; }
.title { color: #8b949e; font-size: 13px; margin-left: auto; margin-right: auto; font-family: monospace; }
.prompt { color: #58a6ff; font-family: monospace; font-size: 14px; margin-bottom: 6px; }
.name { color: #f0f6fc; font-size: 28px; font-weight: 800; margin: 0 0 6px 0; }
.job-title {
font-size: 18px;
font-weight: 700;
background: linear-gradient(90deg, #58a6ff, #3fb950);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
margin-bottom: 8px;
font-family: monospace;
}
.cursor {
display: inline-block;
width: 8px;
height: 18px;
background-color: #3fb950;
vertical-align: middle;
animation: blink 1s infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.desc { color: #8b949e; font-size: 14px; margin-bottom: 18px; }
.stats-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 12px;
background: #161b22;
padding: 12px;
border-radius: 8px;
border: 1px solid #21262d;
text-align: center;
}
.stat-val { font-size: 18px; font-weight: bold; color: #58a6ff; }
.stat-lbl { font-size: 11px; color: #8b949e; margin-top: 2px; }

