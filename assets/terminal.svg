<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1017" />
      <stop offset="100%" stop-color="#04070a" />
    </linearGradient>

    <!-- 네온 시안/에메랄드 그라데이션 -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <style>
      .mono-text { font-family: ui-monospace, SFMono-Regular, "SF Pro Text", Menlo, Consolas, monospace; }
      .ui-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      
      /* 타이포그래피 */
      .title-head { font-size: 32px; font-weight: 900; fill: #ffffff; letter-spacing: -0.5px; }
      .role-tag { font-size: 15px; font-weight: 700; fill: url(#brandGrad); letter-spacing: 0.5px; }
      .sub-desc { font-size: 13px; fill: #94a3b8; line-height: 1.5; }
      .cmd-label { font-size: 12px; font-weight: 600; fill: #2dd4bf; }
      
      /* UI 컴포넌트 */
      .card-bg { fill: #0f172a; stroke: #1e293b; stroke-width: 1.2; rx: 8px; }
      .metric-val { font-size: 20px; font-weight: 800; fill: #38bdf8; }
      .metric-lbl { font-size: 11px; fill: #64748b; font-weight: 500; }
      
      .pill-bg { fill: #131d2e; stroke: #1e293b; stroke-width: 1; rx: 12px; }
      .pill-text { font-size: 11px; fill: #cbd5e1; font-weight: 600; }

      /* 애니메이션 */
      @keyframes softBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      .cursor-blink { animation: softBlink 1.1s infinite; fill: #2dd4bf; }
      .pulse-signal { animation: softBlink 2.4s infinite ease-in-out; }
      
      @keyframes dashMove {
        to { stroke-dashoffset: -16; }
      }
      .pipeline-flow {
        stroke: #2dd4bf;
        stroke-dasharray: 4, 4;
        animation: dashMove 1.8s linear infinite;
      }
    </style>
  </defs>

  <!-- 바깥 프레임 -->
  <rect x="2" y="2" width="916" height="376" rx="16" fill="url(#mainBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- 상단 컨트롤 헤더 -->
  <circle cx="28" cy="22" r="5" fill="#f43f5e" />
  <circle cx="44" cy="22" r="5" fill="#f59e0b" />
  <circle cx="60" cy="22" r="5" fill="#10b981" />
  
  <rect x="350" y="10" width="220" height="24" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="460" y="26" text-anchor="middle" class="mono-text" fill="#64748b" font-size="11px">saebom.dev / pipeline-ops</text>

  <circle cx="850" cy="22" r="4" fill="#10b981" class="pulse-signal" />
  <text x="860" y="26" class="mono-text" fill="#10b981" font-size="11px">ONLINE</text>
  <line x1="2" y1="42" x2="918" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- [좌측 섹션]: 엔지니어 프로필 & 핵심 스택 -->
  <g transform="translate(36, 68)">
    <text x="0" y="16" class="mono-text cmd-label">> SYSTEM.INIT("NO_SAEBOM")</text>
    
    <text x="0" y="54" class="ui-text title-head">노새봄</text>
    <text x="110" y="52" class="mono-text role-tag">[ RPA & Workflow Architect ]</text>
    <rect x="380" y="38" width="8" height="18" class="cursor-blink" />
    
    <text x="0" y="82" class="ui-text sub-desc">실무 병목을 분석하고, 결함 없는 엔드투엔드(E2E) 자동화 솔루션을 구축합니다.</text>

    <!-- 스택 태그 뱃지 -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="84" height="26" class="pill-bg" />
      <text x="42" y="17" text-anchor="middle" class="mono-text pill-text">Python</text>

      <rect x="92" y="0" width="70" height="26" class="pill-bg" />
      <text x="127" y="17" text-anchor="middle" class="mono-text pill-text">PAD</text>

      <rect x="170" y="0" width="98" height="26" class="pill-bg" />
      <text x="219" y="17" text-anchor="middle" class="mono-text pill-text">PowerShell</text>

      <rect x="276" y="0" width="84" height="26" class="pill-bg" />
      <text x="318" y="17" text-anchor="middle" class="mono-text pill-text">REST API</text>

      <rect x="368" y="0" width="76" height="26" class="pill-bg" />
      <text x="406" y="17" text-anchor="middle" class="mono-text pill-text">Docker</text>
    </g>

    <!-- 핵심 지표 3단 미니 대시보드 -->
    <g transform="translate(0, 160)">
      <!-- 지표 1 -->
      <rect x="0" y="0" width="140" height="74" class="card-bg" />
      <text x="16" y="32" class="mono-text metric-val">80%</text>
      <text x="16" y="54" class="ui-text metric-lbl">업무 처리 시간 단축</text>

      <!-- 지표 2 -->
      <rect x="150" y="0" width="140" height="74" class="card-bg" />
      <text x="166" y="32" class="mono-text metric-val">10+ 건</text>
      <text x="166" y="54" class="ui-text metric-lbl">프로덕션 워크플로우</text>

      <!-- 지표 3 -->
      <rect x="300" y="0" width="144" height="74" class="card-bg" />
      <text x="316" y="32" class="mono-text metric-val" fill="#10b981">99.9%</text>
      <text x="316" y="54" class="ui-text metric-lbl">장애 내성 및 복구율</text>
    </g>
  </g>

  <!-- 세로 구분선 -->
  <line x1="510" y1="58" x2="510" y2="355" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4,4" />

  <!-- [우측 섹션]: 실시간 아키텍처 워크플로우 스트림 -->
  <g transform="translate(535, 68)">
    <text x="10" y="16" class="mono-text cmd-label">> AUTOMATION_TOPOLOGY</text>

    <!-- 단계 1: Input Trigger -->
    <g transform="translate(10, 38)">
      <rect x="0" y="0" width="100" height="52" class="card-bg" />
      <circle cx="16" cy="18" r="4" fill="#38bdf8" />
      <text x="26" y="21" class="mono-text" fill="#94a3b8" font-size="10px">TRIGGER</text>
      <text x="16" y="40" class="ui-text" fill="#ffffff" font-size="12px" font-weight="700">Schedule/API</text>
    </g>

    <!-- 연결선 1 -> 2 -->
    <path d="M 110 64 L 140 64" stroke="#1e293b" stroke-width="2" />
    <path d="M 110 64 L 140 64" class="pipeline-flow" stroke-width="2" />

    <!-- 단계 2: Core Processing -->
    <g transform="translate(140, 30)">
      <rect x="0" y="0" width="190" height="68" rx="8" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.4" />
      <circle cx="18" cy="20" r="5" fill="#2dd4bf" class="pulse-signal" />
      <text x="30" y="24" class="mono-text" fill="#2dd4bf" font-size="11px" font-weight="700">RPA ENGINE</text>
      <text x="18" y="44" class="ui-text" fill="#ffffff" font-size="13px" font-weight="700">Data Extraction & Parse</text>
      <text x="18" y="58" class="mono-text" fill="#64748b" font-size="10px">status: ACTIVE_RUNNING</text>
    </g>

    <!-- 연결선 2 -> 3 (분기 하강선) -->
    <path d="M 235 98 L 235 130" stroke="#1e293b" stroke-width="2" />
    <path d="M 235 98 L 235 130" class="pipeline-flow" stroke-width="2" />

    <!-- 단계 3: Valid & Error Guard -->
    <g transform="translate(140, 130)">
      <rect x="0" y="0" width="190" height="54" class="card-bg" />
      <text x="16" y="22" class="mono-text" fill="#f59e0b" font-size="10px">FAULT TOLERANCE</text>
      <text x="16" y="42" class="ui-text" fill="#ffffff" font-size="12px" font-weight="700">Try-Catch & Auto Retry</text>
    </g>

    <!-- 단계 4: Target Destination -->
    <path d="M 140 157 L 90 157" stroke="#1e293b" stroke-width="2" />
    <path d="M 140 157 L 90 157" class="pipeline-flow" stroke-width="2" />

    <g transform="translate(10, 130)">
      <rect x="0" y="0" width="80" height="54" class="card-bg" />
      <text x="14" y="22" class="mono-text" fill="#10b981" font-size="10px">TARGET</text>
      <text x="14" y="42" class="ui-text" fill="#ffffff" font-size="12px" font-weight="700">ERP / DB</text>
    </g>

    <!-- 하단 라이브 로그 스트림 -->
    <g transform="translate(10, 204)">
      <rect x="0" y="0" width="320" height="66" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" class="mono-text" font-size="11px" fill="#2dd4bf">> daemon --watch --pipeline</text>
      <text x="16" y="42" class="mono-text" font-size="10px" fill="#64748b">[OK] Job completed without payload drop</text>
      <text x="16" y="56" class="mono-text" font-size="10px" fill="#38bdf8">[INFO] Next cycle scheduled: 00:05:00</text>
    </g>
  </g>
</svg>
